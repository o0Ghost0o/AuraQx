services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - AUTH_USERNAME=auditor_clinico
      - AUTH_PASSWORD=hackiathon2026
      - JWT_SECRET_KEY=auraqx_jwt_master_secret_key_viamatica_aden_2026
      - OPENAI_BASE_URL=https://api.together.xyz/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=meta-llama/Llama-3.3-70B-Instruct-Turbo
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_POLICIES_DB_ID=${NOTION_POLICIES_DB_ID:-}
      - NOTION_PREAUTHS_DB_ID=${NOTION_PREAUTHS_DB_ID:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://api-auraqx.vertexdc.com}
    depends_on:
      - backend
    restart: unless-stopped
